[general]
; 输入法修复方案。可填：0 或 1。
; 1 的兼容性和输入体验更好，建议优先使用；如果进传送门时卡住，再改成 0。
; 缺少此参数时使用 1。
imeType=1

; 游戏窗口宽度，必须与下面的 height 配套填写。可填：正整数，单位为像素。
; 已验证的组合：1280x720、1366x768、1600x900、1920x1080、1024x768；800x600 不保证可用。
; 缺少此参数时使用 1280。
width=1280
; 游戏窗口高度，必须与上面的 width 配套填写。可填：正整数，单位为像素。
; 不要自行填写未经验证的分辨率，否则部分界面可能错位或导致客户端异常。
; 缺少此参数时使用 720。
height=720

; 游戏服务器的 IPv4 地址。可填示例：127.0.0.1 或 192.168.1.10。
; 只填写 IP，不要添加 http://、端口或引号；IPv4 最长 15 个字符。
; 缺少此参数时使用 127.0.0.1。
ServerIP_Address=127.0.0.1
; 游戏服务器的登录端口。可填：1 到 65535 的整数，不要加引号。
; 必须与服务端实际监听端口一致；缺少此参数时使用 8484。
serverIP_Port=8484

; 是否加载客户端文字汉化。请填写 true 或 false。
; true=加载汉化修改；false=保留客户端原有文字。缺少此参数时使用 false。
SwitchChinese=true

; 右下角经验、金币和道具获得消息同时显示的数量。可填：正整数。
; 数量越大占用的垂直空间越多，过大会让消息超出屏幕；当前建议值为 10。
; 缺少此参数时使用 26。
MsgAmount=10

; UI.wz 是否包含 UI/MapleEzorsiaV2wzfiles.img。请填写 true 或 false。
; true=包含，允许插件使用其中的扩展界面资源；false=不包含，不引用这些资源。
; 填错会造成界面资源缺失；缺少此参数时使用 true。
EzorsiaV2WzIncluded=true
; 是否使用与当前分辨率配套制作的登录界面边框。请填写 true 或 false。
; true=按当前 width 和 height 调整登录边框；false=不应用这部分分辨率适配。
; 只有确实使用了配套 UI.wz 时才开启；缺少此参数时使用 true。
CustomLoginFrame=true
; 登录界面是否使用大边框布局。请填写 true 或 false。
; true=按大边框位置排列登录界面；false=按普通边框排列。
; 必须与 UI.wz 中实际使用的登录边框一致；缺少此参数时使用 false。
bigLoginFrame=true

; 是否强制使用窗口模式。请填写 true 或 false。
; true=窗口模式；false=不强制修改客户端原有显示模式。缺少此参数时使用 true。
WindowedMode=true

; 是否跳过启动时的 Wizet、Nexon 等片头动画。请填写 true 或 false。
; true=跳过；false=正常播放。缺少此参数时使用 true。
RemoveLogos=true

; 写入客户端代码前是否调用 VirtualProtect 修改内存页权限。请填写 true 或 false。
; true=启用，兼容性更好，建议保持开启；false=仅适用于确认代码页已经可写的客户端。
; 关闭后补丁可能写入失败或导致崩溃；缺少此参数时使用 true。
UseVirtuProtect=true

; 是否应用 Wine 环境的选角色闪退修复。请填写 true 或 false。
; true=应用修复，但服务端无法取得客户端的正确 MAC 地址；false=不应用修复。
; Wine 环境建议 true，Windows 真机通常建议 false；缺少此参数时使用 false。
fixWine=true

; 是否把 ResMan 的无限缓存改为按时间淘汰。请填写 true 或 false。
; true=使用下面两个缓存时间，适合控制长期运行时的资源占用；false=恢复客户端原有的无限保留。
; 缺少此参数时使用 true。
resManCacheExpiry=true
; ResMan 序列化对象的缓存保留时间。可填：0 或更大的整数，单位为毫秒。
; 60000=60 秒；负数会被程序改成 0。仅在 resManCacheExpiry=true 时生效。
; 缺少此参数时使用 60000。
resManRetainTimeMs=60000
; ResMan namespace/reparse 对象的缓存保留时间。可填：0 或更大的整数，单位为毫秒。
; 60000=60 秒；负数会被程序改成 0。仅在 resManCacheExpiry=true 时生效。
; 缺少此参数时使用 60000。
resManNameSpaceCacheTimeMs=60000

; 是否让 NameSpace.dll 使用 WZ 流式读取回退路径。请填写 true 或 false。
; true=阻止整文件映射，降低大型 WZ 占用的虚拟地址空间；false=使用原来的整文件映射。
; 建议保持 true；缺少此参数时使用 true。
nameSpaceStreaming=true
; NameSpace 流式读取的小读预取窗口，单位 KiB。相邻读取会合并，减少启动时的
; SetFilePointer/ReadFile 调用；0=关闭预取，最大 4096，缺少此参数时使用 32。
nameSpaceStreamingReadAheadKiB=32
; 小型 WZ 被窗口重复读取超过文件大小两倍后，可晋升为整文件缓存。0=关闭；默认 16 MiB。
nameSpaceStreamingSmallFileCacheMiB=16

; 是否启用高刷新率显示器的启动修复。请填写 true 或 false。
; true=应用刷新率修复；false=不修改客户端刷新率逻辑。
; 只有高刷新率导致启动失败时才建议开启；缺少此参数时使用 false。
fixRefreshRate=false

; 是否禁用 MapleTV 的 SWF 下载和渲染。请填写 true 或 false。
; true=不下载也不播放 MapleTV 媒体，可避开 WzFlashRenderer 异常；false=保留原功能。
; 本项目不需要 MapleTV 媒体，建议保持 true；缺少此参数时使用 true。
disableMapleTVMedia=true

; 是否跳过缺失或类型错误的声音资源。请填写 true 或 false。
; true=声音无效时静默跳过，避免 PlaySE 抛出 E_POINTER；false=保留客户端原行为。
; 建议保持 true；缺少此参数时使用 true。
skipMissingSounds=true

[optional]
; 角色属性面板显示的物理攻击上限。可填：1 到 2147483647 的整数。
; 代码不会检查范围，建议不要超过服务端支持的数值；缺少此参数时使用 199999。
setDamageCap=99999999
; 角色属性面板显示的魔法攻击和魔法防御上限。可填：1 到 2147483647 的整数。
; 代码不会检查范围，建议与服务端属性限制一致；缺少此参数时使用 1999。
setMAtkCap=1999
; 角色属性面板显示的命中上限。可填：1 到 2147483647 的整数。
; 代码不会检查范围，建议与服务端属性限制一致；缺少此参数时使用 999。
setAccCap=999
; 角色属性面板显示的回避上限。可填：1 到 2147483647 的整数。
; 代码不会检查范围，建议与服务端属性限制一致；缺少此参数时使用 999。
setAvdCap=999
; 客户端允许显示和处理的实际输出上限。可填：大于 0 的数字。
; 超过 999999 时会同时调整部分伤害界面；建议使用整数并与服务端伤害上限一致。
; 缺少此参数时使用 199999。
setAtkOutCap=99999999

; 角色移动速度上限。可填：正整数，原版常用上限为 140。
; 代码不会检查范围，设置过高可能造成动作异常或被服务端限制；缺少此参数时使用 140。
speedMovementCap=140
; 角色跳跃力上限。可填：0 到 2147483647 的整数，原版常用上限为 123。
; 代码不会检查合理范围，建议不要高于服务端允许值；缺少此参数时使用 123。
jumpCap=123

; 爬绳速度是否跟随角色移动速度自动变化。请填写 true 或 false。
; true=根据移动速度动态调整；false=使用下面 climbSpeed 指定的固定倍率。
; 缺少此参数时使用 false。
climbSpeedAuto=false
; 固定爬绳速度倍率。可填：大于 0 的小数，例如 1.0、1.25、1.5。
; 1.0=基础速度；仅在 climbSpeedAuto=false 时使用。代码不会检查异常值。
; 缺少此参数时使用 1.0。
climbSpeed=1.0

; 是否启用 Tubi 连续操作机制。请填写 true 或 false。
; true=减少升级加点、技能加点和宠物拾取造成的约 1 秒停顿；false=保留原行为。
; 缺少此参数时使用 false。
useTubi=true

; 是否直接使用 UI.wz 中自行修改的登录背景。请填写 true 或 false。
; true=使用自己的登录背景；false=在 EzorsiaV2WzIncluded=true 时使用扩展 UI 中的背景。
; 只有自行修改过 UI/Login.img/Common/frame 时才开启；缺少此参数时使用 false。
ownLoginFrame=false
; 是否直接使用 UI.wz 中自行修改的商城背景。请填写 true 或 false。
; true=使用自己的商城背景；false=在 EzorsiaV2WzIncluded=true 时使用扩展 UI 中的背景。
; 只有自行修改过商城背景时才开启；缺少此参数时使用 false。
ownCashShopFrame=false

; 是否允许连续发送内容完全相同的聊天消息。请填写 true 或 false。
; true=允许重复内容；false=保留客户端的重复内容限制。缺少此参数时使用 false。
talkRepeat=false
; 两次发送聊天消息之间的最短间隔。可填：0 或更大的整数，单位为毫秒。
; 2000=2 秒，0=不等待；代码不会检查负数，请不要填写负数。缺少此参数时使用 2000。
talkTime=2000

; 远程职业贴近怪物时是否仍使用远程攻击。请填写 true 或 false。
; true=弓箭手、飞侠等贴近怪物时不再改为挥拳；false=保留原行为。
; 缺少此参数时使用 false。
closeRangeShooting=false

; 是否允许把现金道具丢到地上。请填写 true 或 false。
; true=允许丢弃；false=保留客户端限制。服务端仍可能拒绝该操作。
; 缺少此参数时使用 false。
dropCashItem=true

; 装备时是否忽略角色性别限制。请填写 true 或 false。
; true=客户端不检查性别；false=保留原检查。服务端仍可能拒绝不符合条件的装备。
; 缺少此参数时使用 false。
ignoreGender=false

; 是否允许自由分配技能点。请填写 true 或 false。
; true=放宽客户端的技能点分配限制；false=保留原限制。服务端规则仍然有效。
; 缺少此参数时使用 false。
freeSPAllocation=true

; 角色攻击时是否取消客户端的部分停顿限制。请填写 true 或 false。
; true=启用连续攻击修改；false=保留原行为。服务端攻击频率限制仍然有效。
; 缺少此参数时使用 false。
nonStopAttack=true

; NPC 对话文字是否立即完整显示。请填写 true 或 false。
; true=立即显示全部文字；false=按客户端原速度逐字显示。缺少此参数时使用 false。
instantTextDisplay=true

; 拍卖行允许输入的最低售价。可填：1 到 128 的整数。
; 小于 1 会按 1 处理，大于 128 会按 128 处理；缺少此参数时使用 110。
auctionMinPrice=1
; 拍卖行允许输入的最高售价。可填：1 到 2147483647 的整数。
; 应大于或等于 auctionMinPrice，并与服务端允许的最高价格一致。
; 缺少此参数时使用 9999999。
auctionMaxPrice=9999999
; 拍卖行界面是否隐藏手续费并显示卖家填写的原始价格。请填写 true 或 false。
; true=手续费显示为 0，列表和提示显示卖家标价；false=保留原版税费显示。
; 此项只修改客户端显示，服务端实际结算规则不变；缺少此参数时使用 false。
auctionTaxFree=true

; 是否启用自定义天气和昼夜系统。请填写 true 或 false。
; true=安装天气、昼夜和相关封包处理，需要配套 WZ 与服务端代码；false=完全不安装。
; 配套资源或 opcode 不一致时不要开启；缺少此参数时使用 false。
weatherSystem=false

[debug]
; 是否启用详细诊断。请填写 true 或 false。
; true=捕获异常调用栈、内存快照、最终错误弹窗和文件打开失败信息。
; false=不安装异常捕获模块，只保留普通功能状态日志，适合日常游戏。
; 缺少此参数时使用 false。
debug=false
; 是否解除客户端密码限制。请填写 true 或 false。
; true=尝试解除限制，但只有 debug=true 时才生效；false=不修改密码限制。
; 缺少此参数时使用 false。
noPassword=false
